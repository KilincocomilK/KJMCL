<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self' ws://127.0.0.1:5173; object-src 'none'; base-uri 'none'"
    />
    <title>KJMCL · 轻量模式</title>
  </head>
  <body>
    <header>
      <img src="./build/icon.png?no-inline" alt="KJMCL" width="32" height="32" draggable="false" />
      <div>
        <button id="minimize" aria-label="最小化">−</button
        ><button id="close" aria-label="关闭窗口">×</button>
      </div>
    </header>
    <main>
      <h1>轻量模式</h1>
      <ul id="games" aria-label="运行中的游戏"></ul>
      <p id="tasks" class="muted"></p>
      <button id="restore" class="primary">打开完整界面</button>
      <p class="muted">游戏退出后自动恢复</p>
    </main>
    <aside class="light-notifications" aria-label="活动通知">
      <div id="notice" role="status" hidden>
        <span></span><button aria-label="关闭提示">×</button>
      </div>
      <div id="activity" hidden>
        <details>
          <summary><strong></strong><small></small></summary>
          <p></p>
          <button id="release" hidden>查看新版本</button>
        </details>
        <button id="dismiss-activity" aria-label="关闭通知">×</button>
        <progress max="100" aria-label="任务进度" hidden></progress>
      </div>
    </aside>
    <script type="module" src="/src/lightweight.ts"></script>
  </body>
</html>
