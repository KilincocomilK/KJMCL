[package]
name = "kjmcl-save-manager"
version = "0.1.0"
edition = "2024"
authors = ["KilincocomilK"]
license = "MIT"
repository = "https://github.com/KilincocomilK/KJMCL"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastnbt = "2.6"
flate2 = "1"
rayon = "1.11"
sha2 = "0.10"
base64 = "0.22"
png = "0.18"
fs2 = "0.4"
lz4_flex = "0.14"
xxhash-rust = { version = "0.8", features = ["xxh32"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
